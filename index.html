================================================================================
 GYM LOG — SUPABASE SETUP
 Paste this entire SQL block into the Supabase SQL Editor (Project → SQL Editor
 → New query) and run it once before using the app.

 After running this, create your one user account manually:
 Supabase Dashboard → Authentication → Users → Add user (set email + password).
 This app has no public sign-up form on purpose — it's a single-user app.
================================================================================

create extension if not exists pgcrypto;

-- One row per workout day logged
create table if not exists public.sessions (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  date date not null,
  day_number smallint not null check (day_number in (1, 2, 3)),
  created_at timestamptz not null default now(),
  unique (user_id, date)
);

-- One row per logged set within a session
create table if not exists public.sets (
  id uuid primary key default gen_random_uuid(),
  session_id uuid not null references public.sessions(id) on delete cascade,
  exercise_name text not null,
  set_number smallint not null,
  reps integer,
  weight numeric,
  is_alternative boolean not null default false,
  alternative_note text,
  created_at timestamptz not null default now(),
  unique (session_id, exercise_name, set_number)
);

create index if not exists sets_session_id_idx on public.sets (session_id);
create index if not exists sets_exercise_name_idx on public.sets (exercise_name);

alter table public.sessions enable row level security;
alter table public.sets enable row level security;

create policy "sessions_select_own" on public.sessions
  for select using (auth.uid() = user_id);
create policy "sessions_insert_own" on public.sessions
  for insert with check (auth.uid() = user_id);
create policy "sessions_update_own" on public.sessions
  for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "sessions_delete_own" on public.sessions
  for delete using (auth.uid() = user_id);

create policy "sets_select_own" on public.sets
  for select using (
    exists (select 1 from public.sessions where sessions.id = sets.session_id and sessions.user_id = auth.uid())
  );
create policy "sets_insert_own" on public.sets
  for insert with check (
    exists (select 1 from public.sessions where sessions.id = sets.session_id and sessions.user_id = auth.uid())
  );
create policy "sets_update_own" on public.sets
  for update using (
    exists (select 1 from public.sessions where sessions.id = sets.session_id and sessions.user_id = auth.uid())
  ) with check (
    exists (select 1 from public.sessions where sessions.id = sets.session_id and sessions.user_id = auth.uid())
  );
create policy "sets_delete_own" on public.sets
  for delete using (
    exists (select 1 from public.sessions where sessions.id = sets.session_id and sessions.user_id = auth.uid())
  );
================================================================================
-->

<style>

  .app-header {

    align-items: center;

  .completion-ring-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }

  .ring-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 263.9;
    stroke-dashoffset: 263.9;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.6s ease-out;

  .ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ring-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-data);

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--sp-1);
    padding: 0 var(--sp-2) var(--sp-2);

  .stat-card {

    display: flex;

  .stat-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--text-data);
    font-variant-numeric: tabular-nums;

  .day-picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-1);
    padding: 0 var(--sp-2) var(--sp-2);
  }
  .day-option {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    text-align: left;

  .day-option-number {

    font-weight: 600;
    letter-spacing: 0.08em;

    font-variant-numeric: tabular-nums;

  .day-option.selected { border-color: var(--border-active); background: rgba(217, 79, 30, 0.08); }
  .day-option.selected .day-option-number { color: var(--accent-high); }

  .exercise-list { padding: 0 var(--sp-2); }

  .exercise-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);

    padding: var(--sp-2);
    margin-bottom: var(--sp-2);

  .exercise-card.optional { border-left: 3px dashed var(--text-secondary); }
  .exercise-header { position: relative; }
  .exercise-card.optional .exercise-header { cursor: pointer; }
  .exercise-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 28px; }
  .exercise-title-row h3 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;

  .badge.optional-badge {

    color: var(--amber);

    font-weight: 500;

    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;

  .exercise-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .meta-pill {

    top: 2px;
    right: 0;
    color: var(--text-secondary);
    font-size: 16px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;

  .exercise-card.collapsed .exercise-body { display: none; }

  .exercise-body { margin-top: var(--sp-2); }
  .sets-table { display: flex; flex-direction: column; }
  .set-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .set-row:last-child { border-bottom: none; }
  .set-label { width: 40px; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
  .set-inputs { display: flex; gap: 8px; flex: 1; min-width: 0; }
  .input-weight, .input-reps {

    min-width: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-data);
    padding: 9px 10px;
    font-family: var(--font-mono);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .input-weight:focus, .input-reps:focus { outline: none; border-color: var(--border-active); }
  .input-weight::placeholder, .input-reps::placeholder { font-family: var(--font-body); color: var(--text-secondary); }
  .set-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-secondary);

    flex-shrink: 0;
    text-align: right;
    min-width: 34px;
  }
  .set-hint span { color: var(--text-primary); }
  .btn-log {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-secondary);
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-log svg { width: 16px; height: 16px; }
  .set-row.logged .btn-log { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

  .btn-add-set {
    width: 100%;
    margin-top: 8px;
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-secondary);

    padding: 10px;
    font-weight: 500;
    font-size: 13px;
  }

  .btn-alt-toggle {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 12px;
    text-decoration: underline;
    padding: 4px 0;

  .alt-summary {
    font-size: 12px;
    color: var(--amber);

    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .alt-summary svg { width: 13px; height: 13px; flex-shrink: 0; }
  .btn-alt-edit {
    background: none;
    border: none;
    color: var(--text-secondary);
    text-decoration: underline;
    font-size: 12px;
    padding: 0;
  }
  .alt-form { display: flex; gap: 6px; margin-top: 6px; }

    border-radius: var(--radius-sm);

    padding: 8px 10px;
    font-size: 13px;
  }
  .btn-alt-save, .btn-alt-cancel {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-weight: 500;
    font-size: 13px;
    flex-shrink: 0;

  .calendar-header { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-2); }
  .calendar-header span { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: 0.01em; }
  .calendar-header button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    width: 36px;
    height: 36px;
    font-size: 16px;
  }
  .cal-dow-row, .cal-days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    padding: 0 var(--sp-2);
  }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    padding: 4px 0;
  }
  .cal-day {
    aspect-ratio: 1;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;

  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.has-session { background: var(--surface-1); border-color: var(--border); color: var(--text-primary); }
  .cal-day.has-session:hover { background: var(--surface-2); }
  .cal-day.selected { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .cal-day.is-today { border-color: var(--border-active); color: var(--accent-high); font-weight: 700; }

  .cal-dot {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--success);

  .session-detail {
    margin: var(--sp-2);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--sp-2);

  .session-detail h3 { margin: 0 0 var(--sp-1); font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .detail-exercise { margin-bottom: var(--sp-1); }
  .detail-exercise-name { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  .detail-sets { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-set {
    background: var(--surface-2);
    border-radius: 999px;
    padding: 4px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-data);

  .detail-alt-note svg { width: 12px; height: 12px; flex-shrink: 0; }

  .progress-select-label {
    display: block;
    margin: var(--sp-2);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);

    width: 100%;
    margin-top: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 15px;
  }
  .chart-wrap { position: relative; height: 280px; margin: 0 var(--sp-2); }
  #progress-empty { padding: 0 var(--sp-2); }

  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    background: var(--surface-2);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 100;
    height: 64px;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tab-btn svg { width: 21px; height: 21px; }
  .tab-btn.active { color: var(--accent); }

  #toast-container {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;

    gap: 8px;
    z-index: 999;
    pointer-events: none;

    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 16px;

  .toast.error { border-color: var(--destructive); color: var(--destructive); }

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ============================================================
// SUPABASE CONFIG — paste your project values here
// ============================================================
const SUPABASE_URL = 'https://tverznmarwwzcvoyudrb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Hg2CllEdPWmDEt8UUHaLpg_-J_DDYuI';

let supabase = null;
try {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_')) {
    throw new Error('Supabase is not configured yet.');
  }
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (err) {
  console.warn(err);
  supabase = null;
}

// ============================================================
// ICONS (inline SVG, no emoji)
// ============================================================
const ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>',
};

// ============================================================
// PROGRAM DATA
// ============================================================
const DAY_LABELS = {
  1: 'Deadlift & Pull',
  2: 'Squat & Row',
  3: 'Split Squat & Press',
};

const PROGRAM = {
  1: [
    { name: 'Trap Bar Deadlift', sets: 3, repTarget: '4-6', restSeconds: 120, optional: false },
    { name: 'Pull-ups', sets: 3, repTarget: '6-8', restSeconds: 120, optional: false },
    { name: 'Low Incline DB Press', sets: 3, repTarget: '8-10', restSeconds: 120, optional: false },
    { name: 'Incline Bicep Curls', sets: 3, repTarget: '10-12', restSeconds: 60, optional: true },
    { name: 'Toes to Bar', sets: 2, repTarget: 'To failure', restSeconds: 90, optional: true },
    { name: 'Lu Lateral Raises', sets: 2, repTarget: '10-12', restSeconds: 90, optional: true },
  ],
  2: [
    { name: 'Zercher Squat', sets: 5, repTarget: '6-8', restSeconds: 120, optional: false },
    { name: 'Barbell Row', sets: 3, repTarget: '8-10', restSeconds: 120, optional: false },
    { name: 'Half-kneeling Landmine Press', sets: 3, repTarget: '8-10', restSeconds: 120, optional: false },
    { name: 'Hammer Bicep Curls', sets: 3, repTarget: '10-12', restSeconds: 60, optional: true },
    { name: 'Toes to Bar', sets: 2, repTarget: 'To failure', restSeconds: 90, optional: true },
    { name: 'Single-arm DB Lateral Raises', sets: 2, repTarget: '12-15', restSeconds: 90, optional: true },
  ],
  3: [
    { name: 'Bulgarian Split Squats', sets: 3, repTarget: '10-12', restSeconds: 120, optional: false },
    { name: 'DB Row', sets: 3, repTarget: '10-12', restSeconds: 120, optional: false },
    { name: 'Close-grip Bench Press', sets: 3, repTarget: '8-10', restSeconds: 120, optional: false },
    { name: 'Barbell Bicep Curls', sets: 3, repTarget: '10-12', restSeconds: 120, optional: true },
    { name: 'Toes to Bar', sets: 2, repTarget: 'To failure', restSeconds: 90, optional: true },
    { name: 'Skull Crushers', sets: 3, repTarget: '10-12', restSeconds: 90, optional: true },
  ],
};

const RING_CIRCUMFERENCE = 2 * Math.PI * 42;

// ============================================================
// IN-MEMORY STATE
// ============================================================
const state = {
  user: null,
  dataLoaded: false,
  sessions: [],           // all of the user's sessions, loaded once after login
  sets: [],               // all of the user's logged sets, loaded once after login
  sessionsById: {},
  sessionDates: new Set(),
  dayNumber: 1,
  todaySession: null,     // { id: string|null, date, day_number, user_id }
  extraSets: {},          // exerciseName -> number of extra "+ Add Set" rows this session
  alternativeDrafts: {},  // exerciseName -> { isAlternative, note }
  collapsedOptional: new Set(),
  lastPerformedByDay: { 1: null, 2: null, 3: null },
  currentView: 'today',
  calendarYear: 0,
  calendarMonth: 0,       // 0-indexed
  selectedHistoryDate: null,
  historyRendered: false,
  progressRendered: false,
  progressExercise: null,
  chartInstance: null,
};

// ============================================================
// UTILITIES
// ============================================================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatRest(seconds) {
  if (seconds % 60 === 0) return `${seconds / 60} min rest`;
  return `${seconds} sec rest`;
}

function formatDateLong(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateShort(dateStr) {
  const [, m, d] = dateStr.split('-').map(Number);
  return `${m}/${d}`;
}

function findExerciseInProgram(dayNumber, name) {
  return PROGRAM[dayNumber].find((e) => e.name === name);
}

function showToast(message, type) {
  const toast = document.createElement('div');
  toast.className = 'toast' + (type === 'error' ? ' error' : '');
  toast.textContent = message;
  document.getElementById('toast-container').appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

function showLoadingScreen() { document.getElementById('loading-screen').classList.remove('hidden'); }
function hideLoadingScreen() { document.getElementById('loading-screen').classList.add('hidden'); }
function showLogin() { document.getElementById('login-view').classList.remove('hidden'); }
function hideLogin() { document.getElementById('login-view').classList.add('hidden'); }
function showApp() { document.getElementById('app-view').classList.remove('hidden'); }
function hideApp() { document.getElementById('app-view').classList.add('hidden'); }
function showConfigError() {
  hideLoadingScreen();
  document.getElementById('config-error').classList.remove('hidden');
}

// ============================================================
// AUTH
// ============================================================
async function handleLoginSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit-btn');
  errorEl.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in…';
  try {
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
  } catch (err) {
    errorEl.textContent = err.message || 'Login failed';
    errorEl.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log In';
  }
}

async function handleLogout() {
  await supabase.auth.signOut();
}

async function onLoggedIn(user) {
  if (state.user && state.user.id === user.id && state.dataLoaded) return;
  state.user = user;
  hideLogin();
  showLoadingScreen();
  try {
    await loadAllData();
    computeDerived();
    state.dataLoaded = true;
    state.historyRendered = false;
    state.progressRendered = false;
    showApp();
    renderToday();
    switchView('today');
  } catch (err) {
    console.error(err);
    showToast('Failed to load data: ' + err.message, 'error');
  } finally {
    hideLoadingScreen();
  }
}

function onLoggedOut() {
  state.user = null;
  state.dataLoaded = false;
  state.sessions = [];
  state.sets = [];
  state.historyRendered = false;
  state.progressRendered = false;
  if (state.chartInstance) {
    state.chartInstance.destroy();
    state.chartInstance = null;
  }
  hideApp();
  hideLoadingScreen();
  showLogin();
  document.getElementById('login-form').reset();
}

async function init() {
  wireStaticEvents();
  if (!supabase) {
    showConfigError();
    return;
  }
  try {
    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;
    if (data.session && data.session.user) {
      await onLoggedIn(data.session.user);
    } else {
      hideLoadingScreen();
      showLogin();
    }
  } catch (err) {
    console.error(err);
    hideLoadingScreen();
    showLogin();
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      onLoggedOut();
    } else if (session && session.user) {
      onLoggedIn(session.user);
    }
  });
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadAllData() {
  const [sessionsRes, setsRes] = await Promise.all([
    supabase.from('sessions').select('*').order('date', { ascending: true }),
    supabase.from('sets').select('*').order('created_at', { ascending: true }),
  ]);
  if (sessionsRes.error) throw sessionsRes.error;
  if (setsRes.error) throw setsRes.error;
  state.sessions = sessionsRes.data;
  state.sets = setsRes.data;
}

function computeDerived() {
  state.sessionsById = Object.fromEntries(state.sessions.map((s) => [s.id, s]));
  state.sessionDates = new Set(state.sessions.map((s) => s.date));

  const existingToday = state.sessions.find((s) => s.date === todayStr());
  if (existingToday) {
    state.todaySession = existingToday;
  } else {
    const dayNumber = state.sessions.length === 0
      ? 1
      : ((state.sessions[state.sessions.length - 1].day_number % 3) + 1);
    state.todaySession = { id: null, date: todayStr(), day_number: dayNumber, user_id: state.user.id };
  }
  state.dayNumber = state.todaySession.day_number;

  state.collapsedOptional = new Set(PROGRAM[state.dayNumber].filter((e) => e.optional).map((e) => e.name));

  computeLastUsed();
  computeLastPerformedByDay();
  computeExtraSetsFromExisting();

  const now = new Date();
  state.calendarYear = now.getFullYear();
  state.calendarMonth = now.getMonth();
  state.selectedHistoryDate = null;
}

// For each exercise, find the most recent session (excluding today's in-progress
// one) that logged it, and record the weight used per set number.
function computeLastUsed() {
  const result = {};
  const sessionsDesc = [...state.sessions].sort((a, b) => b.date.localeCompare(a.date));
  const todayId = state.todaySession && state.todaySession.id;
  for (const sess of sessionsDesc) {
    if (sess.id === todayId) continue;
    const setsForSession = state.sets.filter((s) => s.session_id === sess.id);
    for (const st of setsForSession) {
      if (st.weight == null) continue;
      if (!result[st.exercise_name]) {
        result[st.exercise_name] = { date: sess.date, bySetNumber: {} };
      }
      if (result[st.exercise_name].date === sess.date && !(st.set_number in result[st.exercise_name].bySetNumber)) {
        result[st.exercise_name].bySetNumber[st.set_number] = st.weight;
      }
    }
  }
  state.lastUsed = result;
}

// For each of the 3 rotating days, find the most recent date it was performed
// (excluding today's in-progress session), so the day-picker can show it.
function computeLastPerformedByDay() {
  const result = { 1: null, 2: null, 3: null };
  const sessionsDesc = [...state.sessions].sort((a, b) => b.date.localeCompare(a.date));
  const todayId = state.todaySession && state.todaySession.id;
  for (const sess of sessionsDesc) {
    if (sess.id === todayId) continue;
    if (result[sess.day_number] == null) {
      result[sess.day_number] = sess.date;
    }
  }
  state.lastPerformedByDay = result;
}

// Restore "+ Add Set" counts and alternative-note drafts if resuming a
// partially-logged session for today (e.g. after a page reload).
function computeExtraSetsFromExisting() {
  state.extraSets = {};
  state.alternativeDrafts = {};
  if (!state.todaySession.id) return;
  const todaySets = state.sets.filter((s) => s.session_id === state.todaySession.id);
  const dayProgram = PROGRAM[state.dayNumber];
  for (const ex of dayProgram) {
    const logged = todaySets.filter((s) => s.exercise_name === ex.name);
    if (logged.length === 0) continue;
    const maxSetNum = Math.max(...logged.map((s) => s.set_number));
    if (maxSetNum > ex.sets) {
      state.extraSets[ex.name] = maxSetNum - ex.sets;
    }
    const altSet = logged.find((s) => s.is_alternative);
    if (altSet) {
      state.alternativeDrafts[ex.name] = { isAlternative: true, note: altSet.alternative_note || '' };
    }
  }
}

function getLoggedSet(exerciseName, setNumber) {
  if (!state.todaySession.id) return null;
  return state.sets.find(
    (s) => s.session_id === state.todaySession.id && s.exercise_name === exerciseName && s.set_number === setNumber
  ) || null;
}

async function ensureTodaySessionPersisted() {
  if (state.todaySession.id) return state.todaySession;
  const { data, error } = await supabase
    .from('sessions')
    .upsert(
      { user_id: state.user.id, date: state.todaySession.date, day_number: state.todaySession.day_number },
      { onConflict: 'user_id,date' }
    )
    .select()
    .single();
  if (error) throw error;
  state.todaySession = data;
  state.sessions.push(data);
  state.sessionsById[data.id] = data;
  state.sessionDates.add(data.date);
  return data;
}

// Let the user override which of the 3 rotating days they want to do today,
// instead of being locked to the auto-detected suggestion.
async function selectDay(dayNumber) {
  if (dayNumber === state.dayNumber) return;
  state.dayNumber = dayNumber;
  state.todaySession.day_number = dayNumber;
  state.collapsedOptional = new Set(PROGRAM[dayNumber].filter((e) => e.optional).map((e) => e.name));
  computeExtraSetsFromExisting();
  renderToday();

  if (state.todaySession.id) {
    try {
      const { error } = await supabase
        .from('sessions')
        .update({ day_number: dayNumber })
        .eq('id', state.todaySession.id);
      if (error) throw error;
      const idx = state.sessions.findIndex((s) => s.id === state.todaySession.id);
      if (idx >= 0) state.sessions[idx].day_number = dayNumber;
    } catch (err) {
      console.error(err);
      showToast('Failed to switch day: ' + err.message, 'error');
    }
  }
}

// ============================================================
// TODAY VIEW — rendering
// ============================================================
function renderToday() {
  const dayProgram = PROGRAM[state.dayNumber];
  document.getElementById('today-day-label').textContent = DAY_LABELS[state.dayNumber];
  document.getElementById('today-date-label').textContent = formatDateLong(state.todaySession.date);
  renderDayPicker();
  const list = document.getElementById('exercise-list');
  list.innerHTML = dayProgram.map((ex) => buildExerciseCardHtml(ex)).join('');
  updateCompletionRing();
  updateStatsRow();
}

// A streak survives gaps of up to MAX_GAP_DAYS between sessions, since this
// program is ~3x/week by design, not daily — a plain "consecutive days" streak
// would break on every rest day.
const STREAK_MAX_GAP_DAYS = 4;

function getSessionDatesDesc() {
  return [...state.sessions].map((s) => s.date).sort((a, b) => b.localeCompare(a));
}

function computeStreak() {
  const dates = getSessionDatesDesc();
  if (dates.length === 0) return 0;
  let streak = 1;
  for (let i = 0; i < dates.length - 1; i++) {
    const cur = new Date(dates[i] + 'T00:00:00');
    const prev = new Date(dates[i + 1] + 'T00:00:00');
    const gapDays = Math.round((cur - prev) / 86400000);
    if (gapDays <= STREAK_MAX_GAP_DAYS) streak++;
    else break;
  }
  return streak;
}

function computeDaysSinceLastWorkout() {
  const dates = getSessionDatesDesc();
  if (dates.length === 0) return null;
  const mostRecent = new Date(dates[0] + 'T00:00:00');
  const today = new Date(todayStr() + 'T00:00:00');
  return Math.round((today - mostRecent) / 86400000);
}

function formatLastWorkoutLabel(days) {
  if (days == null) return '—';
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  return `${days}d ago`;
}

function updateStatsRow() {
  document.getElementById('stat-streak').textContent = String(computeStreak());
  document.getElementById('stat-last').textContent = formatLastWorkoutLabel(computeDaysSinceLastWorkout());
}

function renderDayPicker() {
  const container = document.getElementById('day-picker');
  container.innerHTML = [1, 2, 3].map((n) => {
    const isSelected = n === state.dayNumber;
    const lastDate = state.lastPerformedByDay[n];
    const lastLabel = lastDate ? formatDateShort(lastDate) : 'Not yet';
    return `
      <button class="day-option ${isSelected ? 'selected' : ''}" data-action="select-day" data-day="${n}">
        <span class="day-option-number">Day ${n}</span>
        <span class="day-option-label">${escapeHtml(DAY_LABELS[n])}</span>
        <span class="day-option-last">Last: ${escapeHtml(lastLabel)}</span>
      </button>`;
  }).join('');
}

function computeCompletion() {
  const dayProgram = PROGRAM[state.dayNumber];
  const mandatory = dayProgram.filter((e) => !e.optional);
  const total = mandatory.reduce((sum, e) => sum + e.sets, 0);
  const todayId = state.todaySession.id;
  const logged = todayId
    ? state.sets.filter((s) => s.session_id === todayId && mandatory.some((e) => e.name === s.exercise_name)).length
    : 0;
  return { logged, total };
}

function updateCompletionRing() {
  const { logged, total } = computeCompletion();
  const pct = total > 0 ? Math.min(1, logged / total) : 0;
  const offset = RING_CIRCUMFERENCE * (1 - pct);
  const ringFill = document.querySelector('.ring-fill');
  if (ringFill) ringFill.style.strokeDashoffset = String(offset);
  const valueEl = document.getElementById('ring-value');
  if (valueEl) valueEl.textContent = `${logged}/${total}`;
}

function buildExerciseCardHtml(ex) {
  const isCollapsed = ex.optional && state.collapsedOptional.has(ex.name);
  const totalSets = ex.sets + (state.extraSets[ex.name] || 0);
  const setsHtml = Array.from({ length: totalSets }, (_, i) => buildSetRowHtml(ex, i + 1)).join('');
  const draft = state.alternativeDrafts[ex.name];
  const hasAlt = !!(draft && draft.isAlternative);
  const repLabel = ex.repTarget === 'To failure' ? ex.repTarget : `${ex.repTarget} reps`;

  return `
    <div class="exercise-card ${ex.optional ? 'optional' : 'mandatory'} ${isCollapsed ? 'collapsed' : ''}" data-exercise-card="${escapeHtml(ex.name)}">
      <div class="exercise-header" ${ex.optional ? 'data-action="toggle-collapse"' : ''}>
        <div class="exercise-title-row">
          <h3>${escapeHtml(ex.name)}</h3>
          ${ex.optional ? '<span class="badge optional-badge">Optional</span>' : ''}
        </div>
        <div class="exercise-meta">
          <span class="meta-pill"><strong>${escapeHtml(repLabel)}</strong></span>
          <span class="meta-pill">${formatRest(ex.restSeconds)}</span>
        </div>
        ${ex.optional ? `<span class="collapse-toggle">${isCollapsed ? '▸' : '▾'}</span>` : ''}
      </div>
      <div class="exercise-body">
        <div class="sets-table">${setsHtml}</div>
        <button class="btn-add-set" data-action="add-set">+ Add Set</button>
        <div class="alternative-block">
          <button class="btn-alt-toggle ${hasAlt ? 'hidden' : ''}" data-action="alt-toggle">Used an alternative?</button>
          <div class="alt-summary ${hasAlt ? '' : 'hidden'}">${ICONS.note} Alternative: <span class="alt-note-text">${escapeHtml((draft && draft.note) || '')}</span> <button class="btn-alt-edit" data-action="alt-toggle">Edit</button></div>
          <div class="alt-form hidden">
            <input type="text" class="alt-input" placeholder="What did you do instead?" value="${escapeHtml((draft && draft.note) || '')}">
            <button class="btn-alt-save" data-action="alt-save">Save</button>
            <button class="btn-alt-cancel" data-action="alt-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
}

function buildSetRowHtml(ex, setNumber) {
  const logged = getLoggedSet(ex.name, setNumber);
  const last = state.lastUsed[ex.name];
  const lastWeightForSet = last ? last.bySetNumber[setNumber] : undefined;
  const weightValue = logged && logged.weight != null ? logged.weight : (lastWeightForSet != null ? lastWeightForSet : '');
  const repsValue = logged && logged.reps != null ? logged.reps : '';
  const hint = lastWeightForSet != null ? `<span class="set-hint" title="Last time: ${escapeHtml(String(lastWeightForSet))}">prev <span>${escapeHtml(String(lastWeightForSet))}</span></span>` : '';
  return `
    <div class="set-row ${logged ? 'logged' : ''}">
      <span class="set-label">Set ${setNumber}</span>
      <div class="set-inputs">
        <input type="number" step="any" inputmode="decimal" class="input-weight" placeholder="Weight" value="${weightValue}">
        <input type="number" inputmode="numeric" class="input-reps" placeholder="Reps" value="${repsValue}">
      </div>
      ${hint}
      <button class="btn-log" data-action="log-set" data-set="${setNumber}" title="Log set">${ICONS.check}</button>
    </div>`;
}

// ============================================================
// TODAY VIEW — interactions
// ============================================================
function handleExerciseListClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const card = btn.closest('.exercise-card');
  if (!card) return;
  const exerciseName = card.dataset.exerciseCard;
  switch (btn.dataset.action) {
    case 'log-set':
      handleLogSet(exerciseName, Number(btn.dataset.set), btn);
      break;
    case 'add-set':
      handleAddSet(exerciseName, card);
      break;
    case 'toggle-collapse':
      toggleCollapse(card);
      break;
    case 'alt-toggle':
      toggleAlternativeForm(card);
      break;
    case 'alt-save':
      handleSaveAlternative(exerciseName, card);
      break;
    case 'alt-cancel':
      cancelAlternativeForm(card, exerciseName);
      break;
  }
}

async function handleLogSet(exerciseName, setNumber, buttonEl) {
  const row = buttonEl.closest('.set-row');
  const weightInput = row.querySelector('.input-weight');
  const repsInput = row.querySelector('.input-reps');
  const weight = weightInput.value === '' ? null : Number(weightInput.value);
  const reps = repsInput.value === '' ? null : Number(repsInput.value);

  buttonEl.disabled = true;
  try {
    const session = await ensureTodaySessionPersisted();
    const draft = state.alternativeDrafts[exerciseName];
    const payload = {
      session_id: session.id,
      exercise_name: exerciseName,
      set_number: setNumber,
      reps,
      weight,
      is_alternative: !!(draft && draft.isAlternative),
      alternative_note: (draft && draft.note) || null,
    };
    const { data, error } = await supabase
      .from('sets')
      .upsert(payload, { onConflict: 'session_id,exercise_name,set_number' })
      .select()
      .single();
    if (error) throw error;
    const idx = state.sets.findIndex(
      (s) => s.session_id === data.session_id && s.exercise_name === data.exercise_name && s.set_number === data.set_number
    );
    if (idx >= 0) state.sets[idx] = data; else state.sets.push(data);
    row.classList.add('logged');
    updateCompletionRing();
    updateStatsRow();
    showToast(`Logged ${exerciseName} set ${setNumber}`);
  } catch (err) {
    console.error(err);
    showToast('Failed to save set: ' + err.message, 'error');
  } finally {
    buttonEl.disabled = false;
  }
}

function handleAddSet(exerciseName, card) {
  const table = card.querySelector('.sets-table');
  const newSetNumber = table.querySelectorAll('.set-row').length + 1;
  state.extraSets[exerciseName] = (state.extraSets[exerciseName] || 0) + 1;
  const ex = findExerciseInProgram(state.dayNumber, exerciseName);
  table.insertAdjacentHTML('beforeend', buildSetRowHtml(ex, newSetNumber));
}

function toggleCollapse(card) {
  card.classList.toggle('collapsed');
  const toggleEl = card.querySelector('.collapse-toggle');
  if (toggleEl) toggleEl.textContent = card.classList.contains('collapsed') ? '▸' : '▾';
}

function toggleAlternativeForm(card) {
  card.querySelector('.btn-alt-toggle').classList.add('hidden');
  card.querySelector('.alt-summary').classList.add('hidden');
  const form = card.querySelector('.alt-form');
  form.classList.remove('hidden');
  form.querySelector('.alt-input').focus();
}

function cancelAlternativeForm(card, exerciseName) {
  const draft = state.alternativeDrafts[exerciseName];
  const hasAlt = !!(draft && draft.isAlternative);
  card.querySelector('.alt-form').classList.add('hidden');
  card.querySelector('.btn-alt-toggle').classList.toggle('hidden', hasAlt);
  card.querySelector('.alt-summary').classList.toggle('hidden', !hasAlt);
}

async function handleSaveAlternative(exerciseName, card) {
  const input = card.querySelector('.alt-input');
  const note = input.value.trim();
  const saveBtn = card.querySelector('.btn-alt-save');
  saveBtn.disabled = true;
  try {
    state.alternativeDrafts[exerciseName] = { isAlternative: true, note };
    if (state.todaySession.id) {
      const { data, error } = await supabase
        .from('sets')
        .update({ is_alternative: true, alternative_note: note })
        .eq('session_id', state.todaySession.id)
        .eq('exercise_name', exerciseName)
        .select();
      if (error) throw error;
      data.forEach((updated) => {
        const idx = state.sets.findIndex((s) => s.id === updated.id);
        if (idx >= 0) state.sets[idx] = updated;
      });
    }
    card.querySelector('.alt-form').classList.add('hidden');
    card.querySelector('.btn-alt-toggle').classList.add('hidden');
    const summary = card.querySelector('.alt-summary');
    summary.classList.remove('hidden');
    summary.querySelector('.alt-note-text').textContent = note;
    showToast('Alternative noted');
  } catch (err) {
    console.error(err);
    showToast('Failed to save alternative: ' + err.message, 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

// ============================================================
// HISTORY / CALENDAR VIEW
// ============================================================
function renderCalendar() {
  const year = state.calendarYear;
  const month = state.calendarMonth;
  const label = new Date(year, month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  document.getElementById('cal-month-label').textContent = label;

  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let html = '';
  for (let i = 0; i < startOffset; i++) html += '<div class="cal-day empty"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const hasSession = state.sessionDates.has(dateStr);
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === state.selectedHistoryDate;
    const classes = ['cal-day', hasSession ? 'has-session' : '', isToday ? 'is-today' : '', isSelected ? 'selected' : ''].filter(Boolean).join(' ');
    html += `<button class="${classes}" ${hasSession ? `data-date="${dateStr}"` : 'disabled'}>${day}${hasSession ? '<span class="cal-dot"></span>' : ''}</button>`;
  }
  document.getElementById('calendar-grid').innerHTML = html;
}

function handleCalendarClick(e) {
  const btn = e.target.closest('.cal-day[data-date]');
  if (!btn) return;
  state.selectedHistoryDate = btn.dataset.date;
  renderCalendar();
  renderSessionDetail(btn.dataset.date);
}

function renderSessionDetail(dateStr) {
  const session = state.sessions.find((s) => s.date === dateStr);
  const container = document.getElementById('session-detail');
  if (!session) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }
  const sets = state.sets.filter((s) => s.session_id === session.id);
  const byExercise = {};
  for (const s of sets) {
    if (!byExercise[s.exercise_name]) byExercise[s.exercise_name] = [];
    byExercise[s.exercise_name].push(s);
  }
  const exerciseOrder = PROGRAM[session.day_number].map((e) => e.name);
  const orderedNames = [
    ...exerciseOrder.filter((n) => byExercise[n]),
    ...Object.keys(byExercise).filter((n) => !exerciseOrder.includes(n)),
  ];

  let html = `<h3>${formatDateLong(dateStr)} — ${escapeHtml(DAY_LABELS[session.day_number])}</h3>`;
  for (const name of orderedNames) {
    const setsForEx = byExercise[name].slice().sort((a, b) => a.set_number - b.set_number);
    const altNote = setsForEx.find((s) => s.is_alternative && s.alternative_note);
    html += `<div class="detail-exercise">
      <div class="detail-exercise-name">${escapeHtml(name)}</div>
      <div class="detail-sets">${setsForEx.map((s) => `<span class="detail-set">${s.weight ?? '–'} × ${s.reps ?? '–'}</span>`).join('')}</div>
      ${altNote ? `<div class="detail-alt-note">${ICONS.note} ${escapeHtml(altNote.alternative_note)}</div>` : ''}
    </div>`;
  }
  container.innerHTML = html;
  container.classList.remove('hidden');
}

// ============================================================
// PROGRESS VIEW
// ============================================================
function renderProgressView() {
  const select = document.getElementById('progress-exercise-select');
  const names = [];
  for (const day of [1, 2, 3]) {
    for (const ex of PROGRAM[day]) {
      if (!names.includes(ex.name)) names.push(ex.name);
    }
  }
  select.innerHTML = names.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  select.value = names[0];
  state.progressExercise = names[0];
  renderProgressChart(names[0]);

  select.addEventListener('change', () => {
    state.progressExercise = select.value;
    renderProgressChart(select.value);
  });
}

function getProgressSeries(exerciseName) {
  const sessionsAsc = [...state.sessions].sort((a, b) => a.date.localeCompare(b.date));
  const points = [];
  for (const sess of sessionsAsc) {
    const setsForEx = state.sets.filter((s) => s.session_id === sess.id && s.exercise_name === exerciseName && s.weight != null);
    if (setsForEx.length === 0) continue;
    const topWeight = Math.max(...setsForEx.map((s) => s.weight));
    points.push({ date: sess.date, weight: topWeight });
  }
  return points;
}

function renderProgressChart(exerciseName) {
  const points = getProgressSeries(exerciseName);
  const emptyMsg = document.getElementById('progress-empty');
  const canvas = document.getElementById('progress-chart');

  if (state.chartInstance) {
    state.chartInstance.destroy();
    state.chartInstance = null;
  }

  if (points.length === 0) {
    emptyMsg.classList.remove('hidden');
    canvas.classList.add('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');
  canvas.classList.remove('hidden');

  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 280);
  gradient.addColorStop(0, 'rgba(217, 79, 30, 0.28)');
  gradient.addColorStop(1, 'rgba(217, 79, 30, 0)');
  const monoFont = { family: "'JetBrains Mono', monospace", size: 11 };

  state.chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: points.map((p) => formatDateShort(p.date)),
      datasets: [{
        label: exerciseName,
        data: points.map((p) => p.weight),
        borderColor: '#FF6B35',
        backgroundColor: gradient,
        pointBackgroundColor: '#FFFFFF',
        pointBorderColor: '#D94F1E',
        pointBorderWidth: 2,
        pointRadius: 4,
        borderWidth: 2,
        tension: 0.3,
        fill: true,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8A8A8A', font: monoFont }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { ticks: { color: '#8A8A8A', font: monoFont }, grid: { color: 'rgba(255,255,255,0.04)' } },
      },
    },
  });
}

// ============================================================
// VIEW SWITCHING + STATIC EVENT WIRING
// ============================================================
function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.view').forEach((v) => v.classList.add('hidden'));
  document.getElementById('view-' + view).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  if (view === 'history' && !state.historyRendered) {
    renderCalendar();
    state.historyRendered = true;
  }
  if (view === 'progress' && !state.progressRendered) {
    renderProgressView();
    state.progressRendered = true;
  }
}

function wireStaticEvents() {
  document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
  document.getElementById('logout-btn').addEventListener('click', handleLogout);
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });
  document.getElementById('day-picker').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action="select-day"]');
    if (!btn) return;
    selectDay(Number(btn.dataset.day));
  });
  document.getElementById('exercise-list').addEventListener('click', handleExerciseListClick);
  document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
  document.getElementById('cal-prev').addEventListener('click', () => {
    state.calendarMonth -= 1;
    if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear -= 1; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    state.calendarMonth += 1;
    if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear += 1; }
    renderCalendar();
  });
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((err) => console.warn('Service worker registration failed', err));
  });
}
</script>
