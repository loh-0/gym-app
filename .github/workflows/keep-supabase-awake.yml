# Supabase pauses free-tier projects after ~7 days without activity, which would
# take the app down exactly when you've fallen off and most need it to work.
# This makes a tiny read every 3 days to keep the project awake.
#
# GitHub also disables scheduled workflows in public repos after 60 days with no
# commits, so the second step makes an empty commit if the repo has been quiet
# for 45+ days.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The publishable key is already public in docs/js/config.js; row-level
      # security means this anonymous read returns no rows, but it still hits the DB.
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://tverznmarwwzcvoyudrb.supabase.co
          SUPABASE_KEY: sb_publishable_Hg2CllEdPWmDEt8UUHaLpg_-J_DDYuI
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"

      - uses: actions/checkout@v4

      - name: Keep this schedule from being disabled
        run: |
          last_commit=$(git log -1 --format=%ct)
          days_quiet=$(( ( $(date +%s) - last_commit ) / 86400 ))
          echo "Days since last commit: $days_quiet"
          if [ "$days_quiet" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push
          fi
